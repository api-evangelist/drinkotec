documented_note: >-
  DRINKOTEC does NOT publish an authentication reference. The single public statement about
  authentication is one bullet on the API page — "supports OAuth2 authentication". There is
  no authorization endpoint, token endpoint, grant type, scope list, client-registration
  flow, key-issuance process or example request published anywhere on any DRINKOTEC host.
  Because this artifact records a claim rather than documentation, NO `Authentication`
  pointer is wired into apis.yml — emitting one would assert a reference page the provider
  does not serve.
