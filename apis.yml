  description: The DRINKOTEC API is the integration surface for DRINKOTEC's connected beverage dispensing
    systems and its LOOP360 beverage productivity platform, used to expand DRINKOTEC functionality with
    third-party application integrations such as point-of-sale, payment and ERP or CRM systems. DRINKOTEC
    describes it as a RESTful API that supports XML and JSON and uses OAuth2 authentication, and states
    that complete reference documentation covering every endpoint, attribute and supported method is available
    — but it publishes no link to that documentation, no base URL and no machine-readable contract. Access
    runs through the company's software engineering team via its book-a-visit form.
