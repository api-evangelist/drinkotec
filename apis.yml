description: DRINKOTEC is a Swiss beverage technology company headquartered in Nyon, Vaud, that designs,
  builds and services connected beverage dispensing systems and the software that runs them. Its hardware
  line covers all-in-one and modern postmix dispensers (NEO, VISION PX), compact premix dispensing (DRAFTER),
  cocktails and blends (MANHATTAN), self-service walls, contactless payment (BEVPAY), beer and wine counting
  and control (LEVELUP, BEERMAX), automatic keg switching, cellar cooling monitoring and water fountains.
  LOOP360, its cloud beverage productivity and analytics platform, connects dispensed beverages to a central
  system and is marketed as integrating with ERP and CRM platforms. DRINKOTEC sells into breweries, bars,
  pubs, nightclubs, restaurants, hotels, festivals, sports arenas, cruise ships, offices, schools and
  healthcare, and markets a RESTful DRINKOTEC API for third-party integration whose reference documentation
  is not published publicly.
