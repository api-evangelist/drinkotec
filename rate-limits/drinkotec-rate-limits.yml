description: >-
  DRINKOTEC publishes no rate limits for the DRINKOTEC API.
note: >-
  REPLACES A FABRICATED SCAFFOLD. Until 2026-09-06 this file carried five invented limits
  across free/professional/enterprise tiers — 10 and 100 requests per minute, 1,000 and
  100,000 requests per month, a 1,000 rpm enterprise ceiling — together with an invented
  X-RateLimit-* / Retry-After header set and a 429 exhaustion code. All of it was written
  by the 2026-05-04 bulk sweep and self-declared as "scaffold values to be replaced with
  published provider limits"; none of it came from DRINKOTEC. The provider's public API
  page describes the API in three bullets (RESTful, XML and JSON, OAuth2) and says a
  "complete reference documentation is available" without linking to it. No limits are
  published, no runtime headers could be observed because there is no reachable API host
  (api.drinkotec.ch resolves but serves an Infomaniak "under construction" placeholder and
  404s every path), and no exhaustion behaviour is documented. Zero is the honest count.
