note: >-
  REPLACES A FABRICATED SCAFFOLD. Until 2026-09-06 this file carried three invented tiers
  (Free / Professional / Enterprise) with invented quotas — 1,000 requests per month, 10
  requests per minute, 100,000 requests per month — written by the 2026-05-04 bulk sweep
  and marked in its own description as "scaffold defaults". None of it came from DRINKOTEC.
  The honest measurement is zero: the API page states no price and no tier, there is no
  pricing, tariff, plan or subscription page on drinkotec.ch in any of its French, German
  or English variants, and the site's own WooCommerce install runs the
  "hide-price-and-add-to-cart-button" plugin — this company deliberately does not publish
  prices online. Commercial terms are set in a conversation: the only call to action on
  the API page is "MEET OUR SOFTWARE ENGINEERS", linking to a visit-booking form for the
  Nyon office. An honest zero is the data; see x-coverage in apis.yml.
